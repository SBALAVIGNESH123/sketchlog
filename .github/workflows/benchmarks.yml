name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks & Regression Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
          pip install -e .[server]

      - name: Run Throughput Benchmark
        run: |
          python benchmarks/suite_throughput.py --output benchmark_throughput.json --items 500000 --iterations 3

      - name: Run Accuracy Benchmark
        run: |
          python benchmarks/suite_accuracy.py --output benchmark_accuracy.json --items 50000

      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_throughput.json
            benchmark_accuracy.json

      - name: Regression Policy Check
        run: |
          # A simple script to ensure the benchmarks actually completed and produced valid JSON.
          # We don't strictly fail on performance drops in shared CI, but we ensure the suite itself passes.
          python -c "
          import json
          import sys
          
          def check(file):
              with open(file) as f:
                  data = json.load(f)
              if not data.get('results'):
                  print(f'Error: No results found in {file}')
                  sys.exit(1)
              print(f'Successfully validated {file}')
              
          check('benchmark_throughput.json')
          check('benchmark_accuracy.json')
          "
