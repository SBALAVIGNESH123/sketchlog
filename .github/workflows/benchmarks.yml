name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks & Regression Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install -e .[server]

      - name: Run Throughput Benchmark
        # CI uses reduced counts for speed
        run: |
          PYTHONPATH=. python benchmarks/suite_throughput.py --output benchmark_throughput.json --items 500000 --iterations 3

      - name: Run Accuracy Benchmark
        run: |
          PYTHONPATH=. python benchmarks/suite_accuracy.py --output benchmark_accuracy.json --items 50000

      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: benchmark-results
          path: |
            benchmark_throughput.json
            benchmark_accuracy.json

      - name: Regression Policy Check
        run: |
          # A simple script to ensure the benchmarks actually completed and produced valid JSON.
          # We don't strictly fail on performance drops in shared CI, but we ensure the suite itself passes.
          python -c "
          import json
          import sys

          def check(file):
              with open(file) as f:
                  data = json.load(f)
              if not data.get('results'):
                  print(f'Error: No results found in {file}')
                  sys.exit(1)
              print(f'Successfully validated {file}')

              # Optional: warn (don't fail) if throughput dropped vs. baseline
              if file == 'benchmark_throughput.json':
                  BASELINE_SECONDS = 0.05  # Approximate baseline for 500k items
                  for r in data['results']:
                      if r.get('mean', 0) > BASELINE_SECONDS * 1.5:
                          print(f'WARNING: Possible regression in {file} for {r["name"]} (mean {r["mean"]:.4f} > {BASELINE_SECONDS * 1.5})')

          check('benchmark_throughput.json')
          check('benchmark_accuracy.json')
          "
