name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks & Regression Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install -e .[server]

      - name: Run Throughput Benchmark
        # CI uses reduced counts for speed
        run: |
          PYTHONPATH=python python benchmarks/suite_throughput.py --output benchmark_throughput.json --items 500000 --iterations 5

      - name: Run Accuracy Benchmark
        run: |
          PYTHONPATH=python python benchmarks/suite_accuracy.py --output benchmark_accuracy.json --items 50000

      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark_throughput.json
            benchmark_accuracy.json

      - name: Regression Policy Check
        run: >-
          python benchmarks/check_regressions.py
          --throughput benchmark_throughput.json
          --accuracy benchmark_accuracy.json
          --items 500000
