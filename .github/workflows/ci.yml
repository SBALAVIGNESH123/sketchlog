name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install package
        run: pip install -e .
      
      - name: Install test dependencies
        run: pip install pytest
      
      - name: Run core tests
        run: python -m pytest tests/test_sketchlog.py -v

      - name: Run feature tests
        run: python tests/test_features.py

      - name: Run drift tests
        run: python tests/test_drift.py

      - name: Run windowed tests
        run: python tests/test_windowed.py
  
  test-cpp:
    name: C++ Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure CMake
        run: cmake -B build
      
      - name: Build
        run: cmake --build build --config Release
