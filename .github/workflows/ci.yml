name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read

jobs:
  test-python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install pytest pytest-asyncio numpy httpx "httpx2>=2,<3" hypothesis
          pip install .[server]

      - name: Verify C++ extension loaded
        run: python -c "import sketchlog; assert sketchlog.HAS_CPP, 'C++ extension failed to load'"

      - name: Run fast tests
        run: python -m pytest tests/ -v -m "not slow and not stress and not clustering"

      - name: Run slow tests
        run: python -m pytest tests/ -v -m "slow and not stress and not clustering"

  test-opentelemetry:
    name: OpenTelemetry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install package with extras
        run: |
          pip install pytest numpy
          pip install .[opentelemetry]

      - name: Run OpenTelemetry tests
        run: python -m pytest tests/test_opentelemetry.py -v

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mypy pyright httpx types-psutil
          pip install .[server]

      - name: Run mypy
        run: mypy python/sketchlog

      - name: Run pyright
        run: pyright

      - name: Run API compatibility check
        run: python scripts/check_api_compat.py

      - name: Verify generated OpenAPI contract
        run: python scripts/generate_openapi.py --check

      - name: Verify coupled artifact versions
        run: python scripts/check_versions.py

  python-security:
    name: Python Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install audited runtime
        run: |
          python -m pip install --upgrade "pip==26.1.2" "setuptools==82.0.1"
          python -m pip install ".[server,opentelemetry]" pip-audit bandit
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Scan Python source
        run: bandit -q -r python/sketchlog -ll

  coverage:
    name: Python Branch Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install coverage test environment
        run: pip install ".[test,server,opentelemetry]" pytest-cov
      - name: Enforce branch coverage floor
        run: >-
          python -m pytest tests -m "not stress and not clustering and not slow"
          --cov=sketchlog --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-report=json:coverage.json
          --cov-fail-under=70
      - name: Enforce critical subsystem floors
        run: python scripts/check_coverage.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json

  test-cpp:
    name: C++ Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure -C Release

  test-sanitizers:
    name: C++ Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure CMake with Sanitizers
        run: cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build

      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure

  fuzz-cpp:
    name: C++ Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -DENABLE_FUZZING=ON

      - name: Build Fuzzer
        run: cmake --build build --target fuzz_cpp

      - name: Run Fuzzer
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./build/fuzz_cpp tests/corpus -max_total_time=3600
          else
            ./build/fuzz_cpp tests/corpus -max_total_time=60
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzer-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  test-tsan:
    name: C++ ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Clang
        run: sudo apt-get install -y clang
      - name: Configure CMake with TSan
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=thread -fpie -pie -fno-omit-frame-pointer -g"
      - name: Build
        run: cmake --build build
      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure

  stress-tests:
    name: Stress Tests
    needs: [test-python, test-opentelemetry, test-cpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          pip install pytest pytest-asyncio numpy httpx psutil
          pip install .[server]
      - name: Run stress tests
        env:
          SOAK_DURATION: ${{ github.event_name == 'schedule' && '300' || '30' }}
          # Throughput is enforced only on this controlled Linux runner. Three
          # trials avoid failing on a single noisy measurement; cross-platform
          # matrix jobs still validate that every request succeeds.
          LOAD_TRIALS: "3"
          LOAD_MIN_RPS: "100"
          LOAD_MAX_P99_MS: "2000"
        run: python -m pytest tests/test_load.py tests/test_soak.py tests/test_overload.py tests/test_lifecycle.py tests/test_failure_injection.py -v -m "stress" -o asyncio_mode=auto
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-test-results
          path: tests/results/*.json
          if-no-files-found: ignore

  cluster-tests:
    name: Sketch Mesh Convergence
    needs: [test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install ".[test,server]"
      - name: Run multi-node convergence test
        run: python -m pytest tests/test_clustering.py -v -m clustering

  helm-lint:
    name: Helm Chart Lint
    needs: [test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4
      - name: Lint Helm Chart
        run: helm lint charts/sketchlog
      - name: Template Helm Chart
        run: |
          helm template test charts/sketchlog
          helm template test charts/sketchlog \
            --set replicaCount=3 \
            --set mesh.enabled=true \
            --set mesh.clusterSecret=test-only-secret
          helm template test charts/sketchlog \
            --set replicaCount=3 \
            --set mesh.enabled=true \
            --set mesh.clusterSecret=test-only-secret \
            --set autoscaling.enabled=true | grep HorizontalPodAutoscaler
      - name: Reject unsafe Helm configurations
        run: |
          ! helm template test charts/sketchlog --set replicaCount=2
          ! helm template test charts/sketchlog \
            --set mesh.enabled=true
          ! helm template test charts/sketchlog \
            --set autoscaling.enabled=true
          ! helm template test charts/sketchlog \
            --set mesh.enabled=true \
            --set mesh.clusterSecret=test-only-secret \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=5 \
            --set autoscaling.maxReplicas=2

  web-workspaces:
    name: Web Quality (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend/react-sketchlog, website]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - if: matrix.workspace == 'frontend/react-sketchlog'
        run: npm test
      - run: npm run build

  wasm-runtime:
    name: WASM Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install browser test runtime
        working-directory: wasm
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Build and run Node package smoke test
        working-directory: wasm
        run: npm test
      - name: Run real-browser smoke test
        run: |
          python -m http.server 8765 --directory wasm &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          cd wasm
          npm run test:browser
      - name: Verify publish contents
        working-directory: wasm
        run: npm pack --dry-run

  conformance-ts:
    name: Conformance Suite (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install server
        run: pip install -e .[server]
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Install TS SDK dependencies
        working-directory: clients/typescript
        run: npm ci
      - name: Test TS SDK
        working-directory: clients/typescript
        run: |
          npm audit --audit-level=high
          npm test
      - name: Run Conformance Suite
        run: python clients/conformance/suite.py --cwd clients/typescript --command "npx tsx src/conformance.ts"

  conformance-go:
    name: Conformance Suite (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install server
        run: pip install -e .[server]
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"
          cache: false
      - name: Check Go SDK
        working-directory: clients/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Run Conformance Suite
        run: python clients/conformance/suite.py --cwd clients/go --command "go run cmd/conformance/main.go"

  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: sketchlog:ci-security
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime image
        run: |
          docker run --rm --entrypoint python sketchlog:ci-security -c \
            "import importlib.util, sketchlog; assert sketchlog.HAS_CPP; assert importlib.util.find_spec('pip') is None; assert importlib.util.find_spec('setuptools') is None"
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6 # master 2026-06-28
        with:
          image-ref: sketchlog:ci-security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Build launch demo support images
        run: |
          docker tag sketchlog:ci-security sketchlog-demo-server:local
          docker compose -f demo/compose.yml build telemetry dashboard
      - name: Verify launch demo end to end
        run: |
          docker compose -f demo/compose.yml up --no-build --wait
          docker compose -f demo/compose.yml logs --no-color verifier |
            grep "Launch demo smoke verification passed."
          google-chrome --headless --disable-gpu --no-sandbox \
            --virtual-time-budget=5000 --dump-dom http://127.0.0.1:4173 |
            grep "SYSTEM LIVE"
      - name: Show launch demo logs
        if: failure()
        run: docker compose -f demo/compose.yml logs --no-color
      - name: Stop launch demo
        if: always()
        run: docker compose -f demo/compose.yml down --remove-orphans
