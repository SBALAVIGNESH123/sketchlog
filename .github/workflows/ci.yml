name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read

jobs:
  test-python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install pytest pytest-asyncio numpy httpx hypothesis
          pip install .[server]

      - name: Verify C++ extension loaded
        run: python -c "import sketchlog; assert sketchlog.HAS_CPP, 'C++ extension failed to load'"

      - name: Run fast tests
        run: python -m pytest tests/ -v -m "not slow and not stress"

      - name: Run slow tests
        run: python -m pytest tests/ -v -m "slow and not stress"

  test-opentelemetry:
    name: OpenTelemetry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package with extras
        run: |
          pip install pytest numpy
          pip install .[opentelemetry]

      - name: Run OpenTelemetry tests
        run: python -m pytest tests/test_opentelemetry.py -v

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mypy pyright httpx types-psutil
          pip install .[server]

      - name: Run mypy
        run: mypy python/sketchlog

      - name: Run pyright
        run: pyright python/sketchlog

      - name: Run API compatibility check
        run: python scripts/check_api_compat.py

  test-cpp:
    name: C++ Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure -C Release

  test-sanitizers:
    name: C++ Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure CMake with Sanitizers
        run: cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build

      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure

  fuzz-cpp:
    name: C++ Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -DENABLE_FUZZING=ON

      - name: Build Fuzzer
        run: cmake --build build --target fuzz_cpp

      - name: Run Fuzzer
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ./build/fuzz_cpp tests/corpus -max_total_time=3600
          else
            ./build/fuzz_cpp tests/corpus -max_total_time=60
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: fuzzer-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  test-tsan:
    name: C++ ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Clang
        run: sudo apt-get install -y clang
      - name: Configure CMake with TSan
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=thread -fpie -pie -fno-omit-frame-pointer -g"
      - name: Build
        run: cmake --build build
      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure

  stress-tests:
    name: Stress Tests
    needs: [test-python, test-opentelemetry, test-cpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          pip install pytest pytest-asyncio numpy httpx psutil
          pip install .[server]
      - name: Run stress tests
        env:
          SOAK_DURATION: ${{ github.event_name == 'schedule' && '300' || '30' }}
        run: python -m pytest tests/test_load.py tests/test_soak.py tests/test_overload.py tests/test_lifecycle.py tests/test_failure_injection.py -v -m "stress" -o asyncio_mode=auto
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: stress-test-results
          path: tests/results/*.json
          if-no-files-found: ignore

  helm-lint:
    name: Helm Chart Lint
    needs: [test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4
      - name: Lint Helm Chart
        run: helm lint charts/sketchlog
      - name: Template Helm Chart
        run: helm template test charts/sketchlog

  conformance-ts:
    name: Conformance Suite (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install server
        run: pip install -e .[server]
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
      - name: Install TS SDK dependencies
        working-directory: clients/typescript
        run: npm install
      - name: Run Conformance Suite
        run: python clients/conformance/suite.py --cwd clients/typescript --command "npx tsx src/conformance.ts"

  conformance-go:
    name: Conformance Suite (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install server
        run: pip install -e .[server]
      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.21"
      - name: Run Conformance Suite
        run: python clients/conformance/suite.py --cwd clients/go --command "go run cmd/conformance/main.go"
