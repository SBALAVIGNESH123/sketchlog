name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install pytest numpy httpx
          pip install .[server]

      - name: Verify C++ extension loaded
        run: python -c "import sketchlog; assert sketchlog.HAS_CPP, 'C++ extension failed to load'"

      - name: Run fast tests
        run: python -m pytest tests/ -v -m "not slow"

      - name: Run slow tests
        run: python -m pytest tests/ -v -m "slow"

  test-opentelemetry:
    name: OpenTelemetry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package with extras
        run: |
          pip install pytest numpy
          pip install .[opentelemetry]

      - name: Run OpenTelemetry tests
        run: python -m pytest tests/test_opentelemetry.py -v

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mypy pyright httpx
          pip install .[server]

      - name: Run mypy
        run: mypy python/sketchlog

      - name: Run pyright
        run: pyright python/sketchlog

      - name: Run API compatibility check
        run: python scripts/check_api_compat.py

  test-cpp:
    name: C++ Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure -C Release
