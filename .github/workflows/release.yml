name: Build and Publish

on:
  push:
    tags:
      - 'v*'
      - 'test-*'

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Verify Tag matches Version
        run: python scripts/check_versions.py --tag "$GITHUB_REF_NAME"

      - name: Require successful CI for production tag commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          successful_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
            --jq '.total_count')
          test "$successful_runs" -gt 0

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # SketchLog supports 64-bit Windows; the MSVC 64-bit HLL intrinsic
          # and memory envelope are not supported on win32.
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_EXTRAS: "test,server,opentelemetry"
          CIBW_TEST_COMMAND: >-
            python -c "import sketchlog; assert sketchlog.HAS_CPP, 'Missing C++ backend in wheel'" &&
            pytest {project}/tests -m "not slow and not stress and not clustering"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Verify sdist installation and import
        run: |
          python -m venv test-env
          test-env/bin/pip install dist/*.tar.gz
          test-env/bin/python -c "import sketchlog; assert sketchlog.HAS_CPP, 'Missing C++ backend in sdist build'; print('Successfully imported sketchlog version', sketchlog.__version__)"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publication_preflight:
    name: Validate Publication Credentials
    if: startsWith(github.ref, 'refs/tags/v')
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Verify npm publisher identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          test "$(npm whoami)" = "balavignesh"
      - name: Verify coupled Go module tag
        run: |
          go_ref="refs/tags/clients/go/${GITHUB_REF_NAME}"
          go_sha=$(git ls-remote --refs \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$go_ref" | awk '{print $1}')
          test "$go_sha" = "$GITHUB_SHA"

  publish_testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sketchlog
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist, publication_preflight]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sketchlog
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github_release_testpypi:
    name: Upload Test GitHub Release
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [publish_testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/sketchlog-sbom.spdx.json

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v2.1.0
        with:
          subject-path: 'dist/*'

      - name: Upload binaries to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          prerelease: true
          make_latest: false

  github_release_pypi:
    name: Upload Production GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [post_publish_smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/sketchlog-sbom.spdx.json

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v2.1.0
        with:
          subject-path: 'dist/*'

      - name: Upload binaries to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*

  publish_docker:
    name: Build and Push Docker Image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publication_preflight, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image for security scan
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: sketchlog:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime image
        run: |
          docker run --rm --entrypoint python sketchlog:security-scan -c \
            "import importlib.util, sketchlog; assert sketchlog.HAS_CPP; assert importlib.util.find_spec('pip') is None; assert importlib.util.find_spec('setuptools') is None"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6 # master 2026-06-28
        with:
          image-ref: sketchlog:security-scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push verified multi-platform image
        id: push
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Sign verified image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cosign sign --yes "${image}@${DIGEST}"

  publish_helm:
    name: Package and Publish Helm Chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publication_preflight, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push-chart.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.14.4

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Login Docker client to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Package Chart
        run: helm package charts/sketchlog

      - name: Push Chart to GHCR
        id: push-chart
        run: |
          CHART_PKG=$(ls sketchlog-*.tgz)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          output=$(helm push "${CHART_PKG}" "oci://ghcr.io/${owner}/charts" 2>&1)
          echo "$output"
          digest=$(echo "$output" | sed -n 's/^Digest: //p')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart digest
        env:
          DIGEST: ${{ steps.push-chart.outputs.digest }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cosign sign --yes "ghcr.io/${owner}/charts/sketchlog@${DIGEST}"

  publish_typescript:
    name: Publish TypeScript SDK
    needs: [publication_preflight, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci
      - name: Build TypeScript
        working-directory: clients/typescript
        run: npm test
      - name: Publish to NPM
        working-directory: clients/typescript
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_react:
    name: Publish React SDK
    needs: [publication_preflight, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - working-directory: frontend/react-sketchlog
        run: npm ci
      - working-directory: frontend/react-sketchlog
        run: npm run lint && npm test && npm run build
      - working-directory: frontend/react-sketchlog
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_wasm:
    name: Publish WASM Runtime
    needs: [publication_preflight, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - working-directory: wasm
        run: npm ci
      - working-directory: wasm
        run: npm test
      - working-directory: wasm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_go:
    name: Verify Go SDK Tag
    needs: [publication_preflight, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Verify coupled Go module tag
        run: |
          go_ref="refs/tags/clients/go/${GITHUB_REF_NAME}"
          go_sha=$(git ls-remote --refs \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$go_ref" | awk '{print $1}')
          test "$go_sha" = "$GITHUB_SHA"

  post_publish_smoke:
    name: Public Registry Smoke Tests
    needs: [publish_pypi, publish_typescript, publish_react, publish_wasm, publish_go, publish_docker, publish_helm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.26.4"
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.14.4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install released Python wheel from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..20}; do
            python -m pip install --no-cache-dir "sketchlog==${version}" && break
            test "$attempt" -lt 20
            sleep 15
          done
          python -c "import sketchlog; assert sketchlog.HAS_CPP; assert sketchlog.__version__ == '${version}'"
      - name: Install released NPM packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir npm-smoke && cd npm-smoke && npm init -y
          for attempt in {1..20}; do
            npm install \
              "@sketchlog/client@${version}" \
              "@sketchlog/react@${version}" \
              "@sketchlog/wasm@${version}" && break
            test "$attempt" -lt 20
            sleep 15
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const expectedVersion = process.env.GITHUB_REF_NAME.slice(1);
          for (const name of ['client', 'react', 'wasm']) {
            const metadata = require(`./node_modules/@sketchlog/${name}/package.json`);
            assert.equal(metadata.version, expectedVersion);
          }
          const react = require('./node_modules/@sketchlog/react');
          assert.equal(typeof react.SketchLogProvider, 'function');
          assert.equal(typeof react.CDFCurve, 'function');
          const { StreamLog } = require('./node_modules/@sketchlog/wasm');
          (async () => {
            await StreamLog.init();
            const log = new StreamLog();
            log.addBatch([10, 20, 30]);
            assert.equal(log.totalEvents, 3n);
            assert.ok(log.p99 > 29 && log.p99 < 31);
            log.destroy();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Resolve released Go module through public proxy
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          for attempt in {1..20}; do
            go list -m \
              "github.com/SBALAVIGNESH123/sketchlog/clients/go@${GITHUB_REF_NAME}" \
              && break
            test "$attempt" -lt 20
            sleep 15
          done
      - name: Exercise released image and Helm chart
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker pull "$image"
          container="sketchlog-release-smoke"
          docker run --detach --rm --name "$container" \
            --publish 18000:8000 "$image"
          cleanup() {
            docker logs "$container" || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            curl --fail --silent --show-error \
              http://127.0.0.1:18000/health >/dev/null && break
            test "$attempt" -lt 30
            sleep 1
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { SketchLogClient } =
            require('./npm-smoke/node_modules/@sketchlog/client');
          (async () => {
            const client = new SketchLogClient({
              endpoint: 'http://127.0.0.1:18000',
              maxRetries: 0,
            });
            const health = await client.health();
            assert.equal(health.status, 'ok');
            await client.ingestEvents('release-smoke', {
              latencies: [10, 20, 30],
              uniques: ['alice', 'bob'],
              events: { ok: 3 },
            });
            await client.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          curl --fail --silent --show-error \
            http://127.0.0.1:18000/v1/streams/release-smoke/metrics |
            python -c \
              'import json,sys; data=json.load(sys.stdin); assert data["total_events"] == 6'
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm pull "oci://ghcr.io/${owner}/charts/sketchlog" --version "$version"
          helm lint "sketchlog-${version}.tgz"
          helm template release-smoke "sketchlog-${version}.tgz" \
            --set "image.tag=${version}" >/dev/null
