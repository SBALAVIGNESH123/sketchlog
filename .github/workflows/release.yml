name: Build and Publish

on:
  push:
    tags:
      - 'v*'
      - 'test-*'

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Verify Tag matches Version
        run: |
          python -c "
          import os, re, sys

          with open('pyproject.toml') as f:
              match = re.search(r'^version\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f.read(), re.MULTILINE)
              pyproject_version = match.group(1) if match else sys.exit('No version in pyproject.toml')

          with open('python/sketchlog/__init__.py') as f:
              match = re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f.read())
              init_version = match.group(1) if match else sys.exit('No __version__ in __init__.py')

          if pyproject_version != init_version:
              sys.exit(f'Mismatch: pyproject.toml ({pyproject_version}) vs __init__.py ({init_version})')

          ref_name = os.environ['GITHUB_REF_NAME']
          if ref_name not in [f'v{pyproject_version}', f'test-v{pyproject_version}']:
              sys.exit(f'Error: Tag {ref_name} does not match version {pyproject_version}')

          print('Versions match and tag is valid.')
          "

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_TEST_REQUIRES: "pytest numpy"
          CIBW_TEST_COMMAND: >-
            python -c "import sketchlog; assert sketchlog.HAS_CPP, 'Missing C++ backend in wheel'" &&
            pytest {project}/tests

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Verify sdist installation and import
        run: |
          python -m venv test-env
          test-env/bin/pip install dist/*.tar.gz
          test-env/bin/python -c "import sketchlog; assert sketchlog.HAS_CPP, 'Missing C++ backend in sdist build'; print('Successfully imported sketchlog version', sketchlog.__version__)"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sketchlog
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sketchlog
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github_release_testpypi:
    name: Upload Test GitHub Release
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [publish_testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/sketchlog-sbom.spdx.json

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v2.1.0
        with:
          subject-path: 'dist/*'

      - name: Upload binaries to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          prerelease: true
          make_latest: false

  github_release_pypi:
    name: Upload Production GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/sketchlog-sbom.spdx.json

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v2.1.0
        with:
          subject-path: 'dist/*'

      - name: Upload binaries to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*

  publish_docker:
    name: Build and Push Docker Image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  publish_helm:
    name: Package and Publish Helm Chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Chart
        run: helm package charts/sketchlog

      - name: Push Chart to GHCR
        run: |
          CHART_PKG=$(ls sketchlog-*.tgz)
          helm push ${CHART_PKG} oci://ghcr.io/${{ github.repository_owner }}/charts

  publish_typescript:
    name: Publish TypeScript SDK
    needs: [preflight, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: clients/typescript
        run: npm install
      - name: Build TypeScript
        working-directory: clients/typescript
        run: npm run build --if-present
      - name: Publish to NPM
        working-directory: clients/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_go:
    name: Publish Go SDK Tag
    needs: [preflight, build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create Go Module Tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          GO_TAG="clients/go/${VERSION}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${GO_TAG}" -m "Release Go SDK ${VERSION}"
          git push origin "${GO_TAG}"
