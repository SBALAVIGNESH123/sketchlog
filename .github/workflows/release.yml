name: Build and Publish

on:
  push:
    tags:
      - 'v*'
      - 'test-*'

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Verify Tag matches Version
        run: |
          python -c "
          import os, re, sys

          with open('pyproject.toml') as f:
              match = re.search(r'^version\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f.read(), re.MULTILINE)
              pyproject_version = match.group(1) if match else sys.exit('No version in pyproject.toml')

          with open('python/sketchlog/__init__.py') as f:
              match = re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f.read())
              init_version = match.group(1) if match else sys.exit('No __version__ in __init__.py')

          if pyproject_version != init_version:
              sys.exit(f'Mismatch: pyproject.toml ({pyproject_version}) vs __init__.py ({init_version})')

          ref_name = os.environ['GITHUB_REF_NAME']
          if ref_name not in [f'v{pyproject_version}', f'test-v{pyproject_version}']:
              sys.exit(f'Error: Tag {ref_name} does not match version {pyproject_version}')

          print('Versions match and tag is valid.')
          "

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_SKIP: "cp36-* cp37-* cp38-* pp*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_TEST_REQUIRES: "pytest numpy"
          CIBW_TEST_COMMAND: >-
            python -c "import sketchlog; assert sketchlog.HAS_CPP, 'Missing C++ backend in wheel'" &&
            pytest {project}/tests

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Verify sdist installation and import
        run: |
          python -m venv test-env
          test-env/bin/pip install dist/*.tar.gz
          test-env/bin/python -c "import sketchlog; assert sketchlog.HAS_CPP, 'Missing C++ backend in sdist build'; print('Successfully imported sketchlog version', sketchlog.__version__)"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sketchlog
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sketchlog
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github_release_testpypi:
    name: Upload Test GitHub Release
    if: startsWith(github.ref, 'refs/tags/test-')
    needs: [publish_testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          prerelease: true
          make_latest: false

  github_release_pypi:
    name: Upload Production GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
