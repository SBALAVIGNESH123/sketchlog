{{- if .Values.mesh.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sketchlog.fullname" . }}-mesh
  labels:
    {{- include "sketchlog.labels" . | nindent 4 }}
type: Opaque
stringData:
  cluster-secret: {{ required "mesh.clusterSecret is required" .Values.mesh.clusterSecret | quote }}
{{- end }}
