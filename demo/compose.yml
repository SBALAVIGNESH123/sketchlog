name: sketchlog-launch-demo

services:
  server:
    image: sketchlog-demo-server:local
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SKETCHLOG_MAX_STREAMS: "100"
      SKETCHLOG_MEMORY_THRESHOLD: "95"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  telemetry:
    image: sketchlog-demo-telemetry:local
    build:
      context: .
      dockerfile: telemetry.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  dashboard:
    image: sketchlog-demo-dashboard:local
    build:
      context: ..
      dockerfile: demo/dashboard.Dockerfile
    depends_on:
      server:
        condition: service_healthy
      telemetry:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SKETCHLOG_DEMO_PORT:-4173}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  verifier:
    image: sketchlog-demo-telemetry:local
    build:
      context: .
      dockerfile: telemetry.Dockerfile
    command: ["python", "/demo/smoke.py"]
    depends_on:
      dashboard:
        condition: service_healthy
      telemetry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
