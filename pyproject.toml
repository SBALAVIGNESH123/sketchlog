[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchlog"
version = "1.0.1"
description = "Streaming metrics compression engine. 100M events in 93 KB with bounded error. DDSketch + HyperLogLog + Count-Min Sketch."
authors = [
    {name = "Bala Vignesh S"}
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.8"
keywords = ["streaming", "metrics", "ddsketch", "hyperloglog", "count-min-sketch", "percentile", "p99", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SBALAVIGNESH123/sketchlog"
Repository = "https://github.com/SBALAVIGNESH123/sketchlog"
Issues = "https://github.com/SBALAVIGNESH123/sketchlog/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
sketchlog = ["py.typed"]
