[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=2.12.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchlog"
version = "1.2.3"
description = "Bounded-memory streaming metrics with DDSketch, HyperLogLog, and Count-Min Sketch."
authors = [
    {name = "Bala Vignesh S"}
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
keywords = ["streaming", "metrics", "ddsketch", "hyperloglog", "count-min-sketch", "percentile", "p99", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SBALAVIGNESH123/sketchlog"
Repository = "https://github.com/SBALAVIGNESH123/sketchlog"
Issues = "https://github.com/SBALAVIGNESH123/sketchlog/issues"

[project.scripts]
sketchlog-server = "sketchlog.server:main"
sketchlog-collector = "sketchlog.ebpf.collector:main"
sketchlog-doctor = "sketchlog.doctor:main"
sketchlog-production-check = "sketchlog.doctor:main"
sketchlog-agent = "sketchlog.agent:main"
sketchlog-cost-estimate = "sketchlog.cost_estimate:main"
sketchlog-bench-lab = "sketchlog.bench_lab:main"
sketchlog-db-check = "sketchlog.db_hardening:main"
sketchlog-alert-manager = "sketchlog.alert_manager:main"
sketchlog-mesh-viz = "sketchlog.mesh_visualizer:main"
sketchlog-namespace-admin = "sketchlog.namespace_admin:main"
sketchlog-regression-check = "sketchlog.ci_regression:main"
sketchlog-query-builder = "sketchlog.query_builder:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5.0,<10",
]
test = [
    "pytest",
    "pytest-asyncio",
    "numpy",
    "httpx",
    "httpx2>=2,<3",
    "hypothesis",
    "greenlet",
    "pytest-cov",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite"
]
dev = [
    "pytest",
    "pytest-asyncio",
    "numpy",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5.0,<10",
    "mypy",
    "pyright",
    "httpx",
    "httpx2>=2,<3",
    "hypothesis",
    "types-psutil",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite"
]
opentelemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp"
]
server = [
    "fastapi>=0.100.0,<1",
    "uvicorn>=0.20.0,<1",
    "wsproto>=1.2.0,<2",
    "pydantic>=2.0,<3",
    "structlog>=23.1.0",
    "prometheus-client>=0.17.0",
    "asgi-correlation-id>=4.2.0",
    "psutil",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite"
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
sketchlog = ["py.typed", "ebpf/bpf_code.c"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "_sketchlog_cpp",
    "opentelemetry.*"
]
ignore_missing_imports = true
