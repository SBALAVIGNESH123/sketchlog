
[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=2.12.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchlog"
version = "1.0.1"
description = "Streaming metrics compression engine. 100M events in 93 KB with bounded error. DDSketch + HyperLogLog + Count-Min Sketch."
authors = [
    {name = "Bala Vignesh S"}
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.9"
keywords = ["streaming", "metrics", "ddsketch", "hyperloglog", "count-min-sketch", "percentile", "p99", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SBALAVIGNESH123/sketchlog"
Repository = "https://github.com/SBALAVIGNESH123/sketchlog"
Issues = "https://github.com/SBALAVIGNESH123/sketchlog/issues"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5.0",
]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "hypothesis"
]
dev = [
    "pytest",
    "pytest-asyncio",
    "numpy",
    "mkdocs-material>=9.5.0",
    "mypy",
    "pyright",
    "httpx",
    "hypothesis",
    "types-psutil"
]
opentelemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp"
]
server = [
    "fastapi>=0.100.0,<1",
    "uvicorn>=0.20.0,<1",
    "pydantic>=2.0,<3",
    "structlog>=23.1.0",
    "prometheus-client>=0.17.0",
    "asgi-correlation-id>=4.2.0",
    "psutil"
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
sketchlog = ["py.typed"]



[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "_sketchlog_cpp",
    "opentelemetry.*"
]
ignore_missing_imports = true
