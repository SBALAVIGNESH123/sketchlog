apiVersion: sketchlog.io/v1alpha1
kind: SketchLogCluster
metadata:
  name: production
  namespace: monitoring
spec:
  replicas: 3
  image: sketchlog/sketchlog:latest
  maxStreams: 5000
  retentionDays: 30
  sketchType: ddsketch
  alpha: 0.01
  serviceType: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
