---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sketchlog-operator
  namespace: sketchlog-system
  labels:
    app.kubernetes.io/name: sketchlog-operator
    app.kubernetes.io/managed-by: sketchlog-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sketchlog-operator
  labels:
    app.kubernetes.io/name: sketchlog-operator
    app.kubernetes.io/managed-by: sketchlog-operator
rules:
  # SketchLogCluster CRD
  - apiGroups: [sketchlog.io]
    resources: [sketchlogclusters]
    verbs: [get, list, watch]
  - apiGroups: [sketchlog.io]
    resources: [sketchlogclusters/status]
    verbs: [get, update, patch]
  # Core resources
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Deployments
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # Events (for operator event recording)
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sketchlog-operator
  labels:
    app.kubernetes.io/name: sketchlog-operator
    app.kubernetes.io/managed-by: sketchlog-operator
subjects:
  - kind: ServiceAccount
    name: sketchlog-operator
    namespace: sketchlog-system
roleRef:
  kind: ClusterRole
  name: sketchlog-operator
  apiGroup: rbac.authorization.k8s.io
