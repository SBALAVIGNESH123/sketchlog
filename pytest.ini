[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    stress: marks stress/load/soak tests
    clustering: marks multi-process Sketch Mesh convergence tests
    load: marks load tests
    soak: marks soak tests
    overload: marks overload tests
    lifecycle: marks lifecycle tests
    failure_injection: marks failure injection tests

asyncio_mode = auto
