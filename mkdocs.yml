site_name: SketchLog
site_description: 'Streaming metrics compression engine'
site_author: 'Bala Vignesh S'
repo_url: 'https://github.com/SBALAVIGNESH123/sketchlog'
repo_name: 'SBALAVIGNESH123/sketchlog'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Overview:
      - Getting Started: index.md
      - Architecture & Concepts: architecture.md
      - Benchmarks: benchmarks.md
  - 10x Features:
      - Anomaly Auto-Pilot: features/anomaly_auto_pilot.md
      - Streaming SQL: features/streaming_sql.md
      - Universal Collector: features/universal_collector.md
      - Sketch Mesh: features/sketch_mesh.md
      - Smart SLO Engine: features/smart_slo_engine.md
      - Sketch Diffing: features/sketch_diffing.md
      - WASM Runtime: features/wasm_runtime.md
      - Live Dashboard SDK: features/live_dashboard_sdk.md
      - Multi-Tenancy: features/multi_tenancy.md
  - Guides:
      - Client SDKs: sdks.md
      - Integrations: integrations.md
      - Grafana Dashboard: grafana.md
      - Grafana Data Source Plugin: grafana-datasource-plugin.md
      - OpenTelemetry Collector: otel-collector.md
      - Canary Analysis: canary-analysis.md
      - Standalone Server: server.md
  - Operations:
      - Runbooks: runbooks.md
      - Troubleshooting: troubleshooting.md
      - Release Process: releasing.md
  - Reference:
      - API Reference: api.md
      - Security Threat Model: threat_model.md
      - Formal Guarantees: guarantees.md
      - Compatibility Guarantees: compatibility.md
  - Contributing: contributing.md
