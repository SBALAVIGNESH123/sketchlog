site_name: SketchLog
site_description: 'Streaming metrics compression engine'
site_author: 'Bala Vignesh S'
repo_url: 'https://github.com/SBALAVIGNESH123/sketchlog'
repo_name: 'SBALAVIGNESH123/sketchlog'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Getting Started: index.md
  - Architecture & Concepts: architecture.md
  - Benchmarks: benchmarks.md
  - Client SDKs: sdks.md
  - Integrations: integrations.md
  - Alerting & Drift Detection: alerts.md
  - Grafana Dashboard: grafana.md
  - Runbooks: runbooks.md
  - Troubleshooting: troubleshooting.md
  - API Reference: api.md
  - Standalone Server: server.md
  - Security Threat Model: threat_model.md
  - Formal Guarantees: guarantees.md
  - Compatibility Guarantees: compatibility.md
  - Contributing: contributing.md

